# quadrix/ Python tree. One Rust file per task (Golden Rule 1). Every task ends
# with a pytest run and a PORTING_STATE.yaml status update.
#
# Legend:
#   status: pending | in_progress | done | deferred | blocked
#   rust:   path relative to horizon/crates/
#   python: target module relative to repo root
#   test:   pytest file relative to repo root

plan: horizon-rust-to-quadrix-python
created: 2026-11-22
baseline_regression: "1331 passed, 1 skipped"
