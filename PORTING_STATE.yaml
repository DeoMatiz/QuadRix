#   9. horizon-protocol/src/crypto.rs + resolver (для реального подключения)
#  10. items.rs + item_data.rs + enchant.rs (для инвентаря)
#  11. world_ray.rs (клик по блоку)
#  12. chunk.rs + chunk_status.rs + heightmap.rs (видеть мир)
# ============================================================================

