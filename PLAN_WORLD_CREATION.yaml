# QuadRix — план портирования меню одиночного мира (Create World и окружение)
#
# Составлен после чтения Rust-источников title.rs / title/*.rs и обзора
# Python-дерева quadrix/render/*. Один Rust-файл на PART (Golden Rule 1).
# Каждый PART заканчивается pytest и обновлением PORTING_STATE.yaml.
#
# Цель пользователя: функциональная И визуальная идентичность меню создания
# одиночного мира Horizon. Визуальный слой ванильных виджетов (nine-slice,
# табы, фон) уже частично есть в quadrix/render/gui_atlas.py + ui.py.
#
# Legend:
#   status: pending | in_progress | done | deferred | blocked
#   rust:   путь относительно horizon/crates/
#   python: целевой модуль относительно корня репозитория
#   test:   файл pytest относительно корня репозитория

