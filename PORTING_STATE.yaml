# ============================================================================
# СТАТУСЫ:
#   done    — pytest зелёный, файл закрыт
#   pending — не начат или PARTIAL (см. note)
#   skipped — Rust-only, не нужно в Python
#   blocked — зависит от неготового файла
# ============================================================================
#
# ОЧЕРЕДЬ СЛЕДУЮЩИХ СЕССИЙ (порядок важен, по зависимостям):
#   A. Игровые действия (block placing / breaking / item use / container):
#      1. block_placement.rs
#      2. block_survival.rs
#      3. item_use.rs
#      4. block_support.rs
#      5. simple_container.rs
#      6. world_ray.rs (для клика)
#   B. Инвентарь и экипировка:
#      7. enchant.rs
#      8. item_data.rs (расширение: все 122 компонента)
#      9. player_inventory.rs
#     10. player_equipment.rs
#   C. Чат и команды:
#     11. secure_chat.rs (online-mode)
#     12. commands (парсинг, дерево)
#   D. Эффекты и еда:
#     13. effects (полный)
#     14. potions.rs
#     15. food.rs
#     16. status_effect.rs
#   E. Мир (worldgen, biome, structures):
#     17. worldgen/* (generator.rs 205 КБ — forbidden, но biome/features)
#     18. biome.rs
#     19. structure/*
#   F. Сеть (LAN):
#     20. net.rs (host/peer)
#     21. lan/*
#   G. Рендер (5.8 МБ):
#     22. render/* (все модули, PART 1-N)
#   H. Мобы (3.5 МБ):
#     23. mobs/* (PART 1-N, forbidden по AGENTS.md — но если нужно)
#   I. GUI (menu.rs 170 КБ, title.rs 214 КБ):
#     24. menu/* (forbidden по AGENTS.md)
#   J. Сохранения:
#     25. save.rs (346 КБ, forbidden)
#     26. persist.rs
#   K. Misc:
#     27. sound_source.rs, effect_particles.rs
#     28. protocol strings / text / nbt components
# ============================================================================

