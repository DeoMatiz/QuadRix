port: horizon-rust-to-quadrix-python
repo: https://github.com/DeoMatiz/QuadRix
branch: main

target_dir: quadrix/
entry_point: quadrix.py
package_name: quadrix
display_name: QuadRix            # capital Q, capital R
env_prefix: QUADRIX_

rust_root: horizon/crates/horizon-client/src/
rust_core: horizon/crates/horizon-core/src/
rust_world: horizon/crates/horizon-world/src/
rust_protocol: horizon/crates/horizon-protocol/src/
rust_render: horizon/crates/horizon-client-render/src/

assets_root: .local/
assets_client: .local/horizon-client/26.3/
assets_motion: .local/horizon-client-motion/
assets_collision: .local/horizon-client-collision/
assets_health: .local/horizon-client-health/
assets_block_behavior: .local/horizon-client-block-behavior/
assets_render: .local/horizon-client-render/
assets_structures: .local/horizon-client-structures/
minecraft_cache: .local/minecraft/

last_session: 2026-11-08

# Order matters. Do not port a file until its depends_on are done.
# Statuses: pending | done | skipped | blocked
files:

  # ============================================================================
  # Phase 0: base (types, math, NBT)
  # ============================================================================

  - rust: horizon-core/src/geometry/mod.rs
    python: quadrix/core/geometry.py
    test: tests/core/test_geometry.py
    status: done
    lines_rust: ~700
    lines_python: ~1000
    depends_on: []
    note: >
      Vec3, Aabb, Direction, Axis, BlockHit, java_min/java_max,
      floor_i32, clamp, next_up/next_down.
      ⚠️ Aabb.center() is BROKEN (field instead of method). Test only covers
      what works. Fix later — does not block other files.

  - rust: horizon-world/src/nbt.rs
    python: quadrix/world/nbt.py
    test: tests/world/test_nbt.py
    status: done
    lines_rust: ~1300
    lines_python: ~600
    depends_on: []
    note: "NBT reader. Verified on real movement-properties.nbt (3 keys: blocks, DataVersion, states)."

  - rust: horizon-world/src/registry.rs
    python: quadrix/world/registry.py
    test: tests/world/test_registry.py
    status: done
    lines_rust: ~500
    lines_python: ~700
    depends_on: [horizon-world/src/nbt.rs]
    note: "BlockRegistry. Verified on real block-registry.nbt (35723 states, state 0 = minecraft:air)."

  # ============================================================================
  # Phase 1: physics — fluids
  # ============================================================================

  - rust: entities/fluids.rs
    python: quadrix/entities/fluids.py
    test: tests/entities/fluids/test_fluids.py
    status: done
    lines_rust: 500
    depends_on: [horizon-world/src/nbt.rs, horizon-world/src/registry.rs]
    note: "EntityFluidInteraction, FluidState, FluidTags. ⚠️ fluid_flow() is PLACEHOLDER — must be fixed before motion/fluids.rs uses it."

  - rust: motion/fluids.rs
    python: quadrix/motion/fluids.py
    test: tests/motion/test_fluids.py
    status: done
    lines_rust: 600
    lines_python: ~600
    depends_on: [entities/fluids.rs]
    note: "MotionWorld aggregate (14 tests). Uses Protocol for missing deps (PlayerMotion, SceneCollisions). fluid_flow() may still be placeholder in entities/fluids.py."

  # ============================================================================
  # Phase 2: health — PART 1 (types + PlayerHealth basics)
  # ============================================================================

  - rust: health.rs (PART 1: types + PlayerHealth basics)
    python: quadrix/health.py
    test: tests/test_health.py
    status: done
    lines_rust: ~700
    lines_python: ~1000
    depends_on: [horizon-world/src/registry.rs]
    note: "PART 1: HealthEvent, HurtSource, Knock, BlockOutcome, HurtRecord, AttackRecord, HealthResources, PlayerHealth basics. ⚠️ hurt field is a dict, not State — PART 2 must adapt."

  - rust: health.rs (PART 3: hooks — SKIP)
    python: null
    test: null
    status: skipped
    note: "Rust-only: HURT_SERVER, DAMAGE_PRE, DAMAGE_POST, KNOCKBACK statics. Not needed in Python."

  # ============================================================================
  # Phase 3: dependencies of health.rs PART 2
  # ============================================================================

  - rust: horizon-client-render/src/effects.rs (StatusFlags)
    python: quadrix/effects.py
    test: tests/test_effects.py
    status: done
    lines_rust: ~650
    lines_python: ~150
    depends_on: [health.rs (PART 1)]
    note: "StatusFlags struct: resistance, fire_resistance, absorption, regeneration. 12 tests."

  - rust: game/combat.rs (armor + knockback parts only)
    python: quadrix/combat.py
    test: tests/test_combat.py
    status: done
    lines_rust: ~800
    lines_python: ~200
    depends_on: [health.rs (PART 1)]
    note: "armor_reduction, knockback_strength, hurt_armor. Verified: armor_reduction(20, 8, 10) = 3.0, knockback_strength(0) = 0.4."

  - rust: game/totem.rs
    python: quadrix/totem.py
    test: tests/test_totem.py
    status: done
    lines_rust: ~200
    lines_python: ~150
    depends_on: [health.rs (PART 1), horizon-client-render/src/effects.rs]
    note: "try_use_totem, TOTEM_EFFECTS. 11 tests."

  - rust: health.rs (damage_types loading)
    python: quadrix/health.py
    test: tests/test_health.py
    status: pending
    lines_rust: ~150
    depends_on: [horizon-world/src/nbt.rs]
    note: "Loads .local/horizon-client-health/damage-types.nbt. Needed by hurt() to know damage type tags (is_fire, bypasses_armor, etc.)."

  # ============================================================================
  # Phase 4: health.rs PART 2 (hurt / die) — after all deps done
  # ============================================================================

  - rust: health.rs (PART 2: hurt / die)
    python: quadrix/health.py
    test: tests/test_health.py
    status: pending
    lines_rust: ~800
    depends_on:
      - health.rs (PART 1)
      - horizon-client-render/src/effects.rs (StatusFlags)
      - game/combat.rs (armor + knockback parts only)
      - game/totem.rs
      - health.rs (damage_types loading)
    note: "PART 2: PlayerHealth.hurt, hurt_blocking, hurt_caused_by, Environment, Blocking. NOW all deps exist."

  # ============================================================================
  # Phase 5: motion (after health.rs PART 2)
  # ============================================================================

  - rust: motion/environment.rs
    python: quadrix/motion/environment.py
    test: tests/motion/test_environment.py
    status: pending
    lines_rust: 450
    depends_on: [motion/fluids.rs, health.rs (PART 2)]
    assets: []
    note: "fire_contact, cactus_contact, ignite_contact, impl MotionWorld. Calls hurt() from health.py."

  - rust: motion.rs
    python: quadrix/motion/core.py
    test: tests/motion/test_core.py
    status: pending
    lines_rust: 7000
    depends_on: [motion/fluids.rs, motion/environment.rs, entities/fluids.rs, health.rs (PART 2)]
    assets:
      - .local/horizon-client-motion/movement-properties.nbt
      - .local/horizon-client-collision/cached-collision.nbt
      - .local/horizon-client-motion/landing-definitions.json
      - .local/horizon-client-motion/landing-states.json
    note: "HUGE. Slice by functions. Start with PlayerMotion, gravity, jump, walk only."

  # ============================================================================
  # Phase 6: network
  # ============================================================================

  - rust: player_sync.rs
    python: quadrix/player_sync.py
    test: tests/test_player_sync.py
    status: pending
    lines_rust: 90
    depends_on: [horizon-protocol/src/packets/play.rs]
    assets: []