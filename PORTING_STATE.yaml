# ============================================================================
# СТАТУСЫ:
#   done    — pytest зелёный, файл закрыт
#   pending — не начат или PARTIAL (см. note)
#   skipped — Rust-only, не нужно в Python
#   blocked — зависит от неготового файла
# ============================================================================
#
# ОЧЕРЕДЬ СЛЕДУЮЩИХ СЕССИЙ (порядок важен):
#   1. configuration.rs → configuration.py
#   2. play.rs PART 1 (PacketId + decoding framework)
#   3. play.rs PART 2 (movement/position/tick)
#   4. play.rs PART 3 (entity/player sync)
#   5. play.rs PART 4 (chat/command)
#   6. play.rs PART 5 (inventory/slots)
#   7. play.rs PART 6 (chunk/world)
#   8. player_sync.rs (после play.rs PART 3–4)
#   9. horizon-protocol/src/crypto.rs + resolver (для реального подключения)
#  10. items.rs + item_data.rs + enchant.rs (для инвентаря)
#  11. world_ray.rs (клик по блоку)
#  12. chunk.rs + chunk_status.rs + heightmap.rs (видеть мир)
# ============================================================================

