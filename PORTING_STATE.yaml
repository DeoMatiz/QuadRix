# ============================================================================
# СТАТУСЫ:
#   done    — pytest зелёный, файл закрыт
#   pending — не начат или PARTIAL (см. note)
#   skipped — Rust-only, не нужно в Python
#   blocked — зависит от неготового файла
# ============================================================================
